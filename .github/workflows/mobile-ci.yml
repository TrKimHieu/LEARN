name: mobile-ci
on:
  pull_request:
    paths: &mobile-paths
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'package-lock.json'
      - '.github/workflows/mobile-*.yml'
  push:
    paths: *mobile-paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: preview
      EXPO_PUBLIC_API_URL: https://api.example.com
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        working-directory: .
      - run: npm run lint && npm run typecheck && npm test && npm run test:tooling && npm run export
      - uses: actions/upload-artifact@v4
        with: { name: mobile-web-export, path: apps/mobile/dist }
