name: backend-release
# Merge to main: test, build images once, deploy to staging, then promote the same digests to
# production after approval. Production stays off until PRODUCTION_ENABLED is 'true'.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'apps/compute/**'
      - 'packages/**'
      - 'infra/**'
      - '!infra/Dockerfile.web*'
      - 'scripts/**'
      - '!scripts/deploy/web-release*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-*.yml'
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/backend-ci.yml

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
    outputs:
      api: ${{ env.REGISTRY }}/learn/api@${{ steps.api.outputs.digest || steps.existing.outputs.api }}
      worker: ${{ env.REGISTRY }}/learn/worker@${{ steps.worker.outputs.digest || steps.existing.outputs.worker }}
      migrate: ${{ env.REGISTRY }}/learn/migrate@${{ steps.migrate.outputs.digest || steps.existing.outputs.migrate }}
      bundle: s3://${{ vars.DEPLOY_BUCKET }}/onebox/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: false
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      # ECR tags are immutable: on a re-run, reuse the digest already pushed for this commit instead of
      # pushing again, which fails with "tag already exists".
      - name: Find images already pushed for this commit
        id: existing
        run: |
          for name in api worker migrate; do
            digest=$(aws ecr describe-images --repository-name "learn/$name" \
              --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
            [ "$digest" = "None" ] && digest=""
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
            echo "learn/$name:$GITHUB_SHA -> ${digest:-not pushed yet}"
          done
      - uses: docker/build-push-action@v6
        id: api
        if: steps.existing.outputs.api == ''
        with:
          context: .
          file: infra/Dockerfile.api
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}/learn/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        id: worker
        if: steps.existing.outputs.worker == ''
        with:
          context: .
          file: infra/Dockerfile.worker
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}/learn/worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      # The builder stage carries the Prisma CLI and schema that the runtime image leaves out.
      - uses: docker/build-push-action@v6
        id: migrate
        if: steps.existing.outputs.migrate == ''
        with:
          context: .
          file: infra/Dockerfile.api
          target: builder
          push: true
          tags: ${{ env.REGISTRY }}/learn/migrate:${{ github.sha }}
          cache-from: type=gha,scope=api
      - name: Upload the files the host runs from
        run: |
          for file in infra/onebox/compose.yml infra/onebox/Caddyfile infra/aws/learn-release.sh; do
            aws s3 cp "$file" "s3://${DEPLOY_BUCKET}/onebox/${GITHUB_SHA}/$(basename "$file")"
          done
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}

  staging:
    needs: images
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-deploy.yml
    with:
      environment: staging
      api_image: ${{ needs.images.outputs.api }}
      worker_image: ${{ needs.images.outputs.worker }}
      migrate_image: ${{ needs.images.outputs.migrate }}
      bundle: ${{ needs.images.outputs.bundle }}

  # Required reviewers on the `production` GitHub environment hold this job until approved.
  production:
    needs: [images, staging]
    if: vars.PRODUCTION_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-deploy.yml
    with:
      environment: production
      api_image: ${{ needs.images.outputs.api }}
      worker_image: ${{ needs.images.outputs.worker }}
      migrate_image: ${{ needs.images.outputs.migrate }}
      bundle: ${{ needs.images.outputs.bundle }}
